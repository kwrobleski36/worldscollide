<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide - Manuscript Workspace</title>
    <style>
        /* Base Setup & Reset */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Hard Grid Workspace Layout */
        .manuscript-workspace {
            display: grid;
            grid-template-columns: 320px 1fr;
            grid-template-rows: 80px 1fr 1fr;
            grid-template-areas: 
                "top-scroll top-scroll"
                "left-top main-viewport"
                "left-bottom main-viewport";
            gap: 16px;
            width: 100vw;
            height: 100vh;
            padding: 12px;
            box-sizing: border-box;
        }

        /* Scroll Panel Base Containers */
        .scroll-panel-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Sliced Asset Background Layer using smallscroll.png */
        .scroll-background {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
        }

        .vertical-scroll {
            border-image: url('smallscroll.png') 60 20 60 20 fill;
            border-width: 60px 20px 60px 20px;
        }

        .horizontal-scroll {
            border-image: url('smallscroll.png') 20 60 20 60 fill;
            border-width: 20px 60px 20px 60px;
        }

        /* Text Wrapping Matrix mapped to safe parchment zones */
        .scroll-text-wrapper {
            position: absolute;
            top: 12%;
            left: 10%;
            right: 10%;
            bottom: 12%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: top 0.1s ease;
        }

        /* Enforcing the Final Fantasy VI Monospace Typeface */
        .scroll-text-entry {
            font-family: 'final-fantasy-vi', 'Courier New', monospace;
            color: #4a3621;
            font-size: clamp(10px, 2.5cqi, 16px);
            white-space: pre-wrap;
            word-break: break-word;
            outline: none;
            line-height: 1.4;
        }

        /* Highlight editable field while in designer mode */
        .scroll-text-entry[contenteditable="true"] {
            background: rgba(245, 218, 145, 0.3);
            box-shadow: 0 0 4px #4a3621;
            cursor: text;
        }

        /* Main Map/Game Viewport Window */
        .main-viewport {
            grid-area: main-viewport;
            border: 2px solid #4a3621;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7a6048;
            font-family: monospace;
        }

        /* GM Inspector Floating Widget Style */
        .gm-inspector {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2e2214;
            color: #f5da91;
            padding: 15px;
            border: 2px solid #f5da91;
            font-family: monospace;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .gm-inspector h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            text-transform: uppercase;
        }
        .gm-inspector button {
            background: #f5da91;
            color: #2e2214;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
        }
        .gm-inspector label {
            display: block;
            font-size: 11px;
            margin-bottom: 5px;
        }
        .gm-inspector input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="manuscript-workspace" class="manuscript-workspace">
        
        <div id="panel-top-scroll" class="scroll-panel-container" style="grid-area: top-scroll;">
            <div class="scroll-background horizontal-scroll"></div>
            <div class="scroll-text-wrapper">
                <div id="text-top-scroll" class="scroll-text-entry" contenteditable="false">Worlds Collide Campaign - GM Layout Designer Mode</div>
            </div>
        </div>

        <div id="panel-left-top" class="scroll-panel-container" style="grid-area: left-top;">
            <div class="scroll-background vertical-scroll"></div>
            <div class="scroll-text-wrapper">
                <div id="text-left-top" class="scroll-text-entry" contenteditable="false">Name: Hero&#10;Level: 1&#10;Job: Squire</div>
            </div>
        </div>

        <div id="panel-left-bottom" class="scroll-panel-container" style="grid-area: left-bottom;">
            <div class="scroll-background vertical-scroll"></div>
            <div class="scroll-text-wrapper">
                <div id="text-left-bottom" class="scroll-text-entry" contenteditable="false">Active Quest:&#10;Clear the Forest Floor</div>
            </div>
        </div>

        <div class="main-viewport">
            [Main Screen Viewport Content Engine]
        </div>
    </div>

    <div id="gm-inspector-panel" class="gm-inspector">
        <h3>Designer Panel</h3>
        <button id="btn-toggle-edit" onclick="toggleEditMode()">Toggle Edit Mode</button>
        <hr style="border-color: #4a3621;">
        <div>
            <label>Vertical Position Offset (%):</label>
            <input type="range" id="text-offset-slider" min="5" max="75" value="12" oninput="adjustTextPosition(this.value)" disabled>
        </div>
    </div>

    <script>
        let isEditMode = false;
        let activeTargetTextNode = null;

        // Toggles interactive text modifications and element selections
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const textNodes = document.querySelectorAll('.scroll-text-entry');
            const toggleButton = document.getElementById('btn-toggle-edit');
            const positionSlider = document.getElementById('text-offset-slider');
            
            if (isEditMode) {
                toggleButton.innerText = "Lock Layout & Save";
                toggleButton.style.background = "#8c2d19";
                toggleButton.style.color = "#ffffff";
                positionSlider.removeAttribute('disabled');
                
                textNodes.forEach(node => {
                    node.contentEditable = "true";
                    node.onclick = (e) => {
                        activeTargetTextNode = e.target;
                        // Synchronize slider track position to match the selected zone
                        const currentTop = e.target.parentElement.style.top || "12%";
                        positionSlider.value = parseInt(currentTop);
                    };
                });
            } else {
                toggleButton.innerText = "Toggle Edit Mode";
                toggleButton.style.background = "#f5da91";
                toggleButton.style.color = "#2e2214";
                positionSlider.setAttribute('disabled', 'true');
                
                textNodes.forEach(node => {
                    node.contentEditable = "false";
                    node.onclick = null;
                });

                activeTargetTextNode = null;
                saveLayoutConfiguration();
            }
        }

        // Moves the wrapper containing the editable text relative to the background slice
        function adjustTextPosition(value) {
            if (activeTargetTextNode && isEditMode) {
                activeTargetTextNode.parentElement.style.top = value + "%";
            }
        }

        // Serializes state data to sync with your Cloudflare D1 environment matrix
        function saveLayoutConfiguration() {
            const layoutConfig = {
                layout_version: "production_manuscript_v1",
                timestamp: new Date().toISOString(),
                panels: []
            };

            document.querySelectorAll('.scroll-panel-container').forEach(panel => {
                const textEntry = panel.querySelector('.scroll-text-entry');
                const wrapper = panel.querySelector('.scroll-text-wrapper');
                
                layoutConfig.panels.push({
                    panel_dom_id: panel.id,
                    inner_html: textEntry.innerHTML,
                    top_percentage_offset: wrapper.style.top || "12%"
                });
            });

            console.log("Layout State JSON compiled for Cloudflare D1 Sync:", JSON.stringify(layoutConfig, null, 2));
            // Trigger your custom app fetch call here to pass layoutConfig to your API worker endpoint
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide | The Manuscript</title>
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-dark: #8b6d1b;
            --pixel-border: 4px;
            --bg-overlay: rgba(0, 0, 0, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #000;
        }
        
        .landing-page {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Explicit background layer using manucript.jpg */
        .background-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('manucript.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* UI Interaction centered over the dashboard slots */
        #ui-interact {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 15vh; /* Adjusted to align with the manuscript's layout */
        }

        .snes-button {
            background: var(--gold-primary);
            border: var(--pixel-border) solid var(--gold-dark);
            box-shadow: var(--pixel-border) var(--pixel-border) 0px #000;
            padding: 18px 36px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            color: #000;
            text-transform: uppercase;
            transition: transform 0.1s;
        }

        .snes-button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        /* 2026 Secure Login Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-overlay);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .auth-frame {
            background: #1a1a1a;
            padding: 40px;
            color: #fff;
            text-align: center;
            max-width: 90%;
            width: 440px;
            border: 24px solid transparent;
            /* Using the golden manuscript frames for consistent aesthetic */
            border-image-source: url('manucript.jpg');
            border-image-slice: 100; 
            border-image-repeat: stretch;
            box-sizing: border-box;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        #auth-status { margin: 20px 0; color: var(--gold-primary); }
    </style>
</head>
<body>
    <div class="landing-page">
        <div class="background-layer"></div>

        <main id="ui-interact">
            <button id="auth-trigger" class="snes-button">Create / Login</button>
        </main>

        <div id="auth-modal" class="modal-overlay">
            <div class="auth-frame">
                <h2 style="color: var(--gold-primary); text-shadow: 2px 2px 0px #000;">The Manuscript Access</h2>
                <div id="auth-status">Verifying WebAuthn Credentials...</div>
                <button id="passkey-btn" class="snes-button" style="width: 100%;">Continue with Passkey</button>
                <p style="font-size: 0.75rem; margin-top: 20px; opacity: 0.6;">
                    Phishing-resistant 2FA standard active[cite: 64].
                </p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const setup = () => {
                const modal = document.getElementById('auth-modal');
                const trigger = document.getElementById('auth-trigger');
                const passkeyBtn = document.getElementById('passkey-btn');
                const status = document.getElementById('auth-status');

                if (!modal || !trigger) return;
                trigger.onclick = () => modal.classList.add('active');
                modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

                if (passkeyBtn) {
                    passkeyBtn.onclick = () => {
                        passkeyBtn.disabled = true;
                        status.innerText = "Requesting device biometrics...";
                        setTimeout(() => {
                            status.innerText = "Identity verified. Loading Job Lists...";
                            passkeyBtn.innerText = "Verified";
                        }, 1200);
                    };
                }
            };
            window.addEventListener('load', setup);
        })();
    </script>
</body>
</html>

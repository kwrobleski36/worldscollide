<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('wclonglogo.jpeg');
            background-size: 100% 100%;
            z-index: 1;
        }

        /* Authentication View Layout */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-menu {
            margin-top: 55vh;
            width: 380px;
            background-color: #1a0f2e;
            border: 4px solid #d4af37;
            padding: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,0.85);
            text-align: center;
        }

        .menu-title {
            color: #f2e3c6;
            font-size: 12px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #f2e3c6;
            font-size: 8px;
            cursor: pointer;
            user-select: none;
            margin-top: 10px;
        }

        .checkbox-row input {
            cursor: pointer;
            accent-color: #d4af37;
        }

        .ff-input {
            width: 100%;
            padding: 12px;
            background-color: #000;
            border: 2px solid #5d4485;
            color: #fff;
            font-size: 10px;
            outline: none;
            text-align: center;
        }

        .ff-input::placeholder {
            color: #5d4485;
        }

        .ff-input:focus {
            border-color: #d4af37;
        }

        .ff-btn {
            width: 100%;
            padding: 12px;
            background-color: #3d2466;
            border: 2px solid #d4af37;
            color: #fff;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .ff-btn:hover {
            background-color: #513085;
        }

        /* Main Game View Layout */
        .game-container {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: none;
            padding: 25px;
            gap: 20px;
            background-color: #000;
        }

        /* Left Scroll Panel Slicing Implementation */
        .left-scroll-panel {
            width: 340px;
            height: 100%;
            border-style: solid;
            border-width: 65px 40px 65px 40px;
            border-image: url('smallscroll.jpg') 140 90 140 90 fill repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #38220f;
            margin: -35px 0 -35px 0;
            padding: 10px 0 10px 0;
        }

        .scroll-section {
            width: 100%;
        }

        .scroll-title {
            font-size: 10px;
            text-transform: uppercase;
            border-bottom: 2px dashed #6e4b2a;
            padding-bottom: 6px;
            margin-bottom: 12px;
            color: #1f1105;
            font-weight: bold;
        }

        .player-badge {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 9px;
            line-height: 1.5;
        }

        .profile-placeholder {
            width: 50px;
            height: 50px;
            background-color: #523920;
            border: 2px solid #1f1105;
            margin-bottom: 4px;
        }

        .resource-metrics {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 8px;
            line-height: 1.4;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
        }

        .clock-display {
            font-size: 8px;
            color: #5e1919;
            text-align: center;
            padding: 6px;
            background-color: rgba(0, 0, 0, 0.05);
            border: 1px dashed #6e4b2a;
            margin-bottom: 10px;
        }

        /* Right Dashboard Workspace */
        .manuscript-workspace {
            flex: 1;
            height: 100%;
            background-color: #000;
            border: 4px solid #d4af37;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .workspace-header {
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
            color: #f2e3c6;
            font-size: 12px;
        }

        .workspace-content {
            flex: 1;
            margin-top: 20px;
            color: #666;
            font-size: 10px;
        }

        /* Custom Dialogue Box Overlays */
        .dialogue-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .dialogue-frame {
            width: 340px;
            background-color: #1a0f2e;
            border: 4px solid #d4af37;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .dialogue-text {
            color: #fff;
            font-size: 9px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="background-layer" id="bgLayer"></div>

    <div class="auth-container" id="authInterface">
        <form id="loginForm" class="login-menu" novalidate>
            <div id="emailStep">
                <div class="menu-title">Manuscript Login</div>
                <div class="form-group">
                    <input type="email" id="userEmail" class="ff-input" placeholder="player@email.com">
                </div>
                <button type="submit" class="ff-btn">Confirm</button>
            </div>
            <div id="tokenStep" style="display: none;">
                <div class="menu-title">Enter Passcode</div>
                <div class="form-group">
                    <input type="text" id="verifyToken" class="ff-input" placeholder="000000" maxlength="6">
                </div>
                <div class="form-group checkbox-row">
                    <input type="checkbox" id="keepLoggedIn" checked>
                    <label for="keepLoggedIn">Keep me logged in</label>
                </div>
                <button type="button" id="btnVerify" class="ff-btn">Verify</button>
            </div>
        </form>
    </div>

    <div class="game-container" id="gameInterface">
        <div class="left-scroll-panel">
            <div class="scroll-section">
                <div class="scroll-title">Character</div>
                <div class="player-badge">
                    <div class="profile-placeholder"></div>
                    <div>NAME: <span id="hudName">...</span></div>
                    <div>ROLE: <span id="hudRole">...</span></div>
                    <div>RANK: Lv.<span id="hudLevel">1</span></div>
                    <div>AGE: <span id="hudAge">1</span> Days</div>
                </div>
            </div>

            <div class="scroll-section">
                <div class="scroll-title">Vitals & Job</div>
                <div class="clock-display">
                    ⌛ <span id="globalClock">00:00:00 UTC</span>
                </div>
                <div class="resource-metrics">
                    <div class="metric-row">
                        <span>ENERGY:</span>
                        <span><span id="curEnergy">0</span>/<span id="maxEnergy">0</span></span>
                    </div>
                    <div class="metric-row">
                        <span>WILLPOWER:</span>
                        <span><span id="curWill">0</span>/<span id="maxWill">0</span></span>
                    </div>
                    <div class="metric-row">
                        <span>ACTIVE JOB:</span>
                        <span id="hudJob">None</span>
                    </div>
                    <div class="metric-row">
                        <span>JOB POINTS:</span>
                        <span id="hudJP">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="manuscript-workspace">
            <div class="workspace-header">[ THE MANUSCRIPT INTERFACE ]</div>
            <div class="workspace-content">System placeholders active...</div>
        </div>
    </div>

    <div class="dialogue-overlay" id="dialogueBox">
        <div class="dialogue-frame">
            <div class="dialogue-text" id="dialogueMsg">Message</div>
            <button type="button" class="ff-btn" id="dialogueDismiss">Dismiss</button>
        </div>
    </div>

    <script>
        let currentEmail = '';

        // Dialog Handler
        function showMessage(text) {
            document.getElementById('dialogueMsg').innerText = text;
            document.getElementById('dialogueBox').style.display = 'flex';
        }

        document.getElementById('dialogueDismiss').addEventListener('click', () => {
            document.getElementById('dialogueBox').style.display = 'none';
        });

        // Universal Chronometer Thread Matrix
        function initClock() {
            setInterval(() => {
                const now = new Date();
                const utcStr = now.toISOString().substring(11, 19) + " UTC";
                document.getElementById('globalClock').innerText = utcStr;
            }, 1000);
        }

        // Direct DOM State Mapper
        function renderGameUI(userData) {
            document.getElementById('bgLayer').style.display = 'none';
            document.getElementById('authInterface').style.display = 'none';
            document.getElementById('gameInterface').style.display = 'flex';

            document.getElementById('hudName').innerText = userData.email.split('@')[0];
            document.getElementById('hudRole').innerText = userData.role;
            document.getElementById('hudLevel').innerText = userData.level;
            document.getElementById('hudAge').innerText = userData.age;
            document.getElementById('curEnergy').innerText = userData.energy;
            document.getElementById('maxEnergy').innerText = userData.max_energy;
            document.getElementById('curWill').innerText = userData.willpower;
            document.getElementById('maxWill').innerText = userData.max_willpower;

            initClock();
        }

        // Phase 0: Persistent Local Handshake Verification Check
        document.addEventListener('DOMContentLoaded', () => {
            const cachedSession = localStorage.getItem('wc_active_session');
            if (cachedSession) {
                try {
                    const parsedData = JSON.parse(cachedSession);
                    if (parsedData && parsedData.email) {
                        renderGameUI(parsedData);
                    }
                } catch (e) {
                    localStorage.removeItem('wc_active_session');
                }
            }
        });

        // Phase 1 Request Endpoint
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('userEmail').value.trim();

            if (!emailInput) {
                showMessage("Please enter an e-mail address");
                return;
            }

            currentEmail = emailInput;

            try {
                const response = await fetch('/api/request-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });

                if (!response.ok) {
                    throw new Error("Server communication fault");
                }

                document.getElementById('emailStep').style.display = 'none';
                document.getElementById('tokenStep').style.display = 'block';
            } catch (err) {
                showMessage("Connection failed");
            }
        });

        // Phase 2 Validation Verification Endpoint
        document.getElementById('btnVerify').addEventListener('click', async () => {
            const tokenInput = document.getElementById('verifyToken').value.trim();
            const keepLogged = document.getElementById('keepLoggedIn').checked;

            if (!tokenInput) {
                showMessage("Please enter verification token");
                return;
            }

            try {
                const response = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, code: tokenInput })
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.error || "Verification failed");
                    return;
                }

                // If check box flag evaluates true, record dataset directly into the local device context
                if (keepLogged && data.user) {
                    localStorage.setItem('wc_active_session', JSON.stringify(data.user));
                }

                renderGameUI(data.user);
            } catch (err) {
                showMessage("Connection failed");
            }
        });
    </script>
</body>
</html>

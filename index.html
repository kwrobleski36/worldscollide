<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Explicit Background Layer Technique */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-image: url('wclonglogo.jpeg'); /* Split tan/gold and purple background */
            background-repeat: no-repeat;
            background-position: center top;
            background-size: 100% auto; 
        }

        /* Responsive threshold halting downscaling at half-window view */
        @media (max-width: 1024px) {
            .background-layer {
                background-size: 1024px auto;
            }
        }

        /* UI Overlay Container */
        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Final Fantasy VI Style Menu Window */
        .ff-login-window {
            margin-top: 48vh; /* Positioned cleanly beneath the upper-third logo space */
            width: 400px;
            padding: 20px;
            
            /* Color Composition: Deep purple fill with a classic retro tan/gold double-border */
            background-color: #1a0926; 
            border: 4px solid #e5c158;
            outline: 2px solid #000;
            box-shadow: inset 0 0 0 2px #3c1e5a, 0 8px 16px rgba(0,0,0,0.8);
            
            border-radius: 4px;
        }

        .ff-form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .ff-label {
            display: block;
            color: #e5c158; /* Tan label text */
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }

        /* Classic Retro Text Input Slot */
        .ff-input-email {
            width: 100%;
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
            color: #ffffff;
            background-color: #000000;
            border: 2px solid #3c1e5a;
            outline: none;
        }

        .ff-input-email:focus {
            border-color: #e5c158; /* Highlights tan on selection */
        }

        /* FF6 Style Action Button */
        .ff-btn-login {
            width: 100%;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            
            /* Tan/gold primary button layout with purple text */
            color: #1a0926;
            background-color: #e5c158;
            border: 2px solid #ffffff;
            box-shadow: 0 4px #000000;
        }

        .ff-btn-login:active {
            transform: translateY(2px);
            box-shadow: 0 2px #000000;
        }

        .turnstile-holder {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #3c1e5a;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>

    <div class="ui-container">
        <div class="ff-login-window">
            <form onsubmit="handleEmailLogin(event)">
                <div class="ff-form-group">
                    <label class="ff-label">Enter E-Mail Address</label>
                    <input type="email" class="ff-input-email" autocomplete="email" required placeholder="player@wcgroups.com">
                </div>
                
                <button type="submit" class="ff-btn-login">Confirm</button>
            </form>
            
            <div class="turnstile-holder">[ System Secure ]</div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            console.log("Worlds Collide Retro Menu Interface Initialized.");
        });

        function handleEmailLogin(event) {
            event.preventDefault();
            const emailInput = document.querySelector('.ff-input-email').value;
            console.log("Processing login token submission for: " + emailInput);
            alert("Handshake initialized for: " + emailInput);
        }
    </script>
</body>
</html>

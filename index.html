<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide - GM Sidebar Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Base Setup & Reset */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Two-Column Responsive Sidebar Framework */
        .manuscript-workspace {
            display: grid;
            grid-template-columns: var(--sidebar-width, 320px) 1fr;
            grid-template-rows: var(--top-panel-height, 1fr) 1fr;
            grid-template-areas: 
                "left-top main-viewport"
                "left-bottom main-viewport";
            gap: 16px;
            width: 100vw;
            height: 100vh;
            padding: 12px;
            box-sizing: border-box;
        }

        /* Scroll Panel Base Containers */
        .scroll-panel-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Inverted typographic style defaults for pure black background fills */
            --font-weight: normal;
            --font-color: #ffffff;
            --font-outline: none;
        }

        /* Sliced Asset Background Layer using your exact black-filled smallscroll.png dimensions */
        .scroll-background {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
            border-image: url('smallscroll.png') 60 20 60 20 fill;
            border-width: 60px 20px 60px 20px;
        }

        /* Text Coordinates positioned precisely over safe black canvas area */
        .scroll-text-wrapper {
            position: absolute;
            top: var(--text-y-offset, 15%);
            left: 14%;
            right: 14%;
            bottom: 15%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Enforcing 'Press Start 2P' text presentation with dynamic variable cascades */
        .scroll-text-entry {
            font-family: 'Press Start 2P', monospace;
            color: var(--font-color);
            font-weight: var(--font-weight);
            text-shadow: var(--font-outline);
            font-size: clamp(8px, 1.8cqi, 12px);
            white-space: pre-wrap;
            word-break: break-word;
            outline: none;
            line-height: 1.6;
        }

        /* Visual indicator configurations for designer state loops */
        .manuscript-workspace.edit-active .scroll-panel-container {
            outline: 2px dashed #4a3621;
            cursor: pointer;
        }

        .manuscript-workspace.edit-active .scroll-panel-container.selected-target {
            outline: 2px solid #f5da91;
            box-shadow: 0 0 8px rgba(245, 218, 145, 0.4);
        }

        .scroll-text-entry[contenteditable="true"] {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Core Map Window Layer */
        .main-viewport {
            grid-area: main-viewport;
            border: 4px double #4a3621;
            background: rgba(20, 20, 20, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7a6048;
        }

        /* GM Studio Command Panel Elements */
        .gm-inspector {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #111;
            color: #f5da91;
            padding: 15px;
            border: 2px solid #4a3621;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            width: 300px;
        }
        .gm-inspector h3 {
            margin: 0 0 10px 0;
            font-size: 9px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
        }
        .gm-inspector button {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            background: #4a3621;
            color: #f5da91;
            border: 1px solid #f5da91;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 12px;
        }
        .gm-inspector .control-group {
            margin-bottom: 10px;
        }
        .gm-inspector label {
            display: block;
            font-size: 7px;
            margin-bottom: 4px;
        }
        .gm-inspector input[type="range"], .gm-inspector select, .gm-inspector input[type="color"] {
            width: 100%;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            background: #000;
            color: #f5da91;
            border: 1px solid #4a3621;
            box-sizing: border-box;
        }
        .gm-inspector input[type="color"] {
            height: 24px;
            padding: 2px;
            cursor: pointer;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-row input {
            width: auto !important;
        }
    </style>
</head>
<body>

    <div id="manuscript-workspace" class="manuscript-workspace">
        
        <div id="panel-left-top" class="scroll-panel-container" style="grid-area: left-top;" onclick="focusElement(this, event)">
            <div class="scroll-background"></div>
            <div class="scroll-text-wrapper">
                <div id="text-left-top" class="scroll-text-entry" contenteditable="false">NAME: HERO&#10;LVL: 01&#10;JOB: SQUIRE</div>
            </div>
        </div>

        <div id="panel-left-bottom" class="scroll-panel-container" style="grid-area: left-bottom;" onclick="focusElement(this, event)">
            <div class="scroll-background"></div>
            <div class="scroll-text-wrapper">
                <div id="text-left-bottom" class="scroll-text-entry" contenteditable="false">QUEST:&#10;CLEAR THE FLOOR</div>
            </div>
        </div>

        <div class="main-viewport">
            [VIEWPORT RENDER LAYER]
        </div>
    </div>

    <div id="gm-inspector-panel" class="gm-inspector">
        <h3>SIDEBAR CONTROL DECK</h3>
        <button id="btn-toggle-edit" onclick="toggleDesignerMode()">TOGGLE DESIGNER</button>
        
        <div class="control-group">
            <label>SIDEBAR WIDTH (PX):</label>
            <input type="range" id="slide-width" min="200" max="500" value="320" oninput="modifyGridTrack('width', this.value)" disabled>
        </div>
        <div class="control-group">
            <label>SIDEBAR SPLIT STEP (%):</label>
            <input type="range" id="slide-split" min="20" max="80" value="50" oninput="modifyGridTrack('split', this.value)" disabled>
        </div>

        <hr style="border-color: #4a3621; margin: 12px 0;">
        <h3>FONT STYLE STUDIO</h3>
        
        <div class="control-group">
            <label>TEXT LINE OFFSET (%):</label>
            <input type="range" id="text-offset-slider" min="5" max="65" value="15" oninput="applyTypographyStyle('offset', this.value)" disabled>
        </div>
        <div class="control-group">
            <label>FONT COLOR:</label>
            <input type="color" id="font-color-picker" value="#ffffff" oninput="applyTypographyStyle('color', this.value)" disabled>
        </div>
        <div class="control-group checkbox-row">
            <input type="checkbox" id="font-bold-check" onchange="applyTypographyStyle('bold', this.checked)" disabled>
            <label for="font-bold-check" style="margin: 0;">BOLDFACE TYPE</label>
        </div>
        <div class="control-group checkbox-row">
            <input type="checkbox" id="font-outline-check" onchange="applyTypographyStyle('outline', this.checked)" disabled>
            <label for="font-outline-check" style="margin: 0;">BLACK OUTLINE</label>
        </div>
    </div>

    <script>
        let isEditMode = false;
        let activeTargetPanel = null;
        const workspace = document.getElementById('manuscript-workspace');

        // Activates configuration maps and input states across variables
        function toggleDesignerMode() {
            isEditMode = !isEditMode;
            const textNodes = document.querySelectorAll('.scroll-text-entry');
            const toggleButton = document.getElementById('btn-toggle-edit');
            const structuralControls = ['slide-width', 'slide-split'];
            
            if (isEditMode) {
                workspace.classList.add('edit-active');
                toggleButton.innerText = "LOCK GRID SECTOR";
                toggleButton.style.background = "#8c2d19";
                toggleButton.style.color = "#ffffff";
                
                structuralControls.forEach(id => document.getElementById(id).removeAttribute('disabled'));
                textNodes.forEach(node => node.contentEditable = "true");
            } else {
                workspace.classList.remove('edit-active');
                toggleButton.innerText = "TOGGLE DESIGNER";
                toggleButton.style.background = "#4a3621";
                toggleButton.style.color = "#f5da91";
                
                if (activeTargetPanel) {
                    activeTargetPanel.classList.remove('selected-target');
                    activeTargetPanel = null;
                }
                
                const styleControls = [...structuralControls, 'text-offset-slider', 'font-color-picker', 'font-bold-check', 'font-outline-check'];
                allControls = styleControls.forEach(id => {
                    const el = document.getElementById(id);
                    el.setAttribute('disabled', 'true');
                    if (el.type === 'checkbox') el.checked = false;
                });
                
                textNodes.forEach(node => node.contentEditable = "false");
                saveStateToConsole();
            }
        }

        // Sets focus hook constraints on selected node arrays
        function focusElement(element, event) {
            if (!isEditMode) return;
            event.stopPropagation();

            if (activeTargetPanel) {
                activeTargetPanel.classList.remove('selected-target');
            }

            activeTargetPanel = element;
            activeTargetPanel.classList.add('selected-target');

            // Free typography deck field controls
            const typographyFields = ['text-offset-slider', 'font-color-picker', 'font-bold-check', 'font-outline-check'];
            typographyFields.forEach(id => document.getElementById(id).removeAttribute('disabled'));

            // Parse runtime variables to align the controller options
            const wrapper = element.querySelector('.scroll-text-wrapper');
            const currentOffset = parseInt(window.getComputedStyle(wrapper).getPropertyValue('--text-y-offset') || "15");
            document.getElementById('text-offset-slider').value = currentOffset;

            const currentColor = window.getComputedStyle(element).getPropertyValue('--font-color').trim() || "#ffffff";
            document.getElementById('font-color-picker').value = rgbToHex(currentColor);

            const currentWeight = window.getComputedStyle(element).getPropertyValue('--font-weight').trim();
            document.getElementById('font-bold-check').checked = (currentWeight === 'bold');

            const currentOutline = window.getComputedStyle(element).getPropertyValue('--font-outline').trim();
            document.getElementById('font-outline-check').checked = (currentOutline !== 'none' && currentOutline !== '');
        }

        // Commits individual custom styling declarations down to node scopes
        function applyTypographyStyle(property, value) {
            if (!activeTargetPanel || !isEditMode) return;

            const wrapper = activeTargetPanel.querySelector('.scroll-text-wrapper');

            if (property === 'offset') {
                wrapper.style.setProperty('--text-y-offset', `${value}%`);
            } else if (property === 'color') {
                activeTargetPanel.style.setProperty('--font-color', value);
            } else if (property === 'bold') {
                activeTargetPanel.style.setProperty('--font-weight', value ? 'bold' : 'normal');
            } else if (property === 'outline') {
                // Severe contrast multi-directional pixel drop shadow mapping black lines around white text elements
                const outlineString = value ? 
                    '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000' : 'none';
                activeTargetPanel.style.setProperty('--font-outline', outlineString);
            }
        }

        // Adjusts grid configurations using dynamic CSS properties
        function modifyGridTrack(type, value) {
            if (!isEditMode) return;
            
            if (type === 'width') {
                workspace.style.setProperty('--sidebar-width', `${value}px`);
            } else if (type === 'split') {
                workspace.style.setProperty('--top-panel-height', `${value}fr`);
            }
        }

        // Standardizes coordinate values back into hex outputs for element selectors
        function rgbToHex(rgb) {
            if (rgb.startsWith('#')) return rgb;
            const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (!match) return "#ffffff";
            return "#" + [match[1], match[2], match[3]].map(x => {
                const hex = parseInt(x).toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join('');
        }

        // Compiles JSON configurations for backend matrix persistence
        function saveStateToConsole() {
            const payload = {
                target_region: "left_sidebar_black_variant",
                tracks: {
                    sidebar_width: window.getComputedStyle(workspace).getPropertyValue('--sidebar-width') || "320px",
                    top_panel_weight: window.getComputedStyle(workspace).getPropertyValue('--top-panel-height') || "1fr"
                },
                panels: []
            };

            document.querySelectorAll('.scroll-panel-container').forEach(panel => {
                const textEntry = panel.querySelector('.scroll-text-entry');
                const wrapper = panel.querySelector('.scroll-text-wrapper');
                
                payload.panels.push({
                    dom_id: panel.id,
                    content: textEntry.innerHTML,
                    styles: {
                        y_offset: window.getComputedStyle(wrapper).getPropertyValue('--text-y-offset') || "15%",
                        color: window.getComputedStyle(panel).getPropertyValue('--font-color') || "#ffffff",
                        weight: window.getComputedStyle(panel).getPropertyValue('--font-weight') || "normal",
                        outline: window.getComputedStyle(panel).getPropertyValue('--font-outline') || "none"
                    }
                });
            });

            console.log("State Saved:", JSON.stringify(payload, null, 2));
        }
    </script>
</body>
</html>

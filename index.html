<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-image: url('wclonglogo.jpeg');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: 100% 100%; 
        }

        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Final Fantasy VI Style Menu Window Configuration */
        .ff-login-window {
            margin-top: 55vh;
            width: 420px;
            padding: 24px;
            background-color: #1a0926; 
            border: 4px solid #e5c158;
            outline: 2px solid #000;
            box-shadow: inset 0 0 0 2px #3c1e5a, 0 8px 16px rgba(0,0,0,0.8);
            border-radius: 4px;
        }

        .ff-form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .ff-label {
            display: block;
            color: #e5c158;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }

        .ff-input-field {
            width: 100%;
            padding: 12px;
            font-family: inherit;
            font-size: 0.75rem;
            color: #ffffff;
            background-color: #000000;
            border: 2px solid #3c1e5a;
            outline: none;
            letter-spacing: 1px;
        }

        .ff-input-field:focus {
            border-color: #e5c158;
        }

        .ff-btn-action {
            width: 100%;
            padding: 14px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            color: #1a0926;
            background-color: #e5c158;
            border: 2px solid #ffffff;
            box-shadow: 0 4px #000000;
        }

        .ff-btn-action:active {
            transform: translateY(2px);
            box-shadow: 0 2px #000000;
        }

        .system-status {
            margin-top: 14px;
            font-size: 0.5rem;
            color: #5c3582;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>

    <div class="ui-container">
        <div class="ff-login-window">
            
            <form id="email-stage" onsubmit="requestCode(event)">
                <div class="ff-form-group">
                    <label class="ff-label">Enter E-Mail Address</label>
                    <input type="email" id="user-email" class="ff-input-field" autocomplete="email" required placeholder="player@wcgroups.com">
                </div>
                <button type="submit" class="ff-btn-action">Confirm</button>
            </form>

            <form id="code-stage" onsubmit="verifyCode(event)" style="display: none;">
                <div class="ff-form-group">
                    <label class="ff-label">Enter Secret Token</label>
                    <input type="text" id="auth-code" class="ff-input-field" maxlength="6" pattern="\d{6}" required placeholder="000000">
                </div>
                <button type="submit" class="ff-btn-action">Verify</button>
            </form>
            
            <div id="status-display" class="system-status">[ System Secure ]</div>
        </div>
    </div>

    <script>
        let currentSessionEmail = "";

        async function requestCode(event) {
            event.preventDefault();
            const emailInput = document.getElementById('user-email').value;
            const statusDisplay = document.getElementById('status-display');
            
            statusDisplay.innerText = "CONNECTING...";
            statusDisplay.style.color = "#ffffff";

            try {
                const response = await fetch('/functions/api/request-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput })
                });
                const data = await response.json();

                if (data.success) {
                    currentSessionEmail = emailInput;
                    // Switches visible form containers via display toggles
                    document.getElementById('email-stage').style.display = 'none';
                    document.getElementById('code-stage').style.display = 'block';
                    
                    statusDisplay.innerText = "INPUT VERIFICATION CODE";
                    statusDisplay.style.color = "#e5c158";
                } else {
                    statusDisplay.innerText = `ERROR: ${data.error}`;
                    statusDisplay.style.color = "#ff0000";
                }
            } catch (error) {
                statusDisplay.innerText = "CONNECTION FAILED";
                statusDisplay.style.color = "#ff0000";
            }
        }

        async function verifyCode(event) {
            event.preventDefault();
            const codeInput = document.getElementById('auth-code').value;
            const statusDisplay = document.getElementById('status-display');

            statusDisplay.innerText = "VERIFYING TOKENS...";
            statusDisplay.style.color = "#ffffff";

            try {
                const response = await fetch('/functions/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentSessionEmail, code: codeInput })
                });
                const data = await response.json();

                if (data.success) {
                    statusDisplay.innerText = `ACCESS: ${data.user.role}`;
                    statusDisplay.style.color = "#00ff00";
                    console.log("Account context loaded:", data.user);
                } else {
                    statusDisplay.innerText = `DENIED: ${data.error}`;
                    statusDisplay.style.color = "#ff0000";
                }
            } catch (error) {
                statusDisplay.innerText = "TRANSACTION ERROR";
                statusDisplay.style.color = "#ff0000";
            }
        }
    </script>
</body>
</html>

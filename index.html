<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide - Authoritative Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000; overflow: hidden; font-family: 'Press Start 2P', monospace; }
        .manuscript-workspace { display: flex; width: 100vw; height: 100vh; padding: 12px; box-sizing: border-box; gap: 16px; }
        
        /* Sidebar Layout */
        .sidebar-container { display: flex; flex-direction: column; width: 320px; height: 100%; position: relative; }
        .scroll-panel { position: relative; width: 100%; border-image: url('smallscroll.png') 60 20 60 20 fill; border-width: 60px 20px 60px 20px; }
        
        /* Main Viewport */
        .main-viewport { flex-grow: 1; border: 4px double #4a3621; background: rgba(20, 20, 20, 0.8); display: flex; flex-direction: column; }
        
        /* DOS Terminal */
        .terminal-console-panel { width: 100%; height: 180px; background: #000; border-top: 4px double #4a3621; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; }
        .terminal-log-area { flex-grow: 1; overflow-y: auto; color: #aaa; font-size: 9px; }
        .terminal-input-row { display: flex; align-items: center; color: #fff; font-size: 10px; }
        .terminal-input-field { flex-grow: 1; background: transparent; border: none; outline: none; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 10px; }
    </style>
</head>
<body>

    <div class="manuscript-workspace">
        <div class="sidebar-container" id="ui-panels">
            <div id="panel-left-top" class="scroll-panel"></div>
        </div>

        <div class="main-viewport">
            <div class="terminal-console-panel">
                <div class="terminal-log-area" id="terminal-log-output"></div>
                <div class="terminal-input-row">
                    <span>&gt;</span>
                    <input type="text" id="terminal-command-line" class="terminal-input-field" autocomplete="off" autofocus>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            let playerState = { name: "...", account: "...", level: "...", age: "...", job: "..." };

            // 1. Authoritative State Fetching
            async function syncState() {
                try {
                    const res = await fetch('/api/get-status');
                    if (res.ok) {
                        playerState = await res.json();
                        updateSidebar();
                    }
                } catch (e) { console.error("Server sync failed."); }
            }

            // 2. Authoritative Layout Loading
            async function syncLayout() {
                try {
                    const res = await fetch('/api/ui-manager');
                    const config = await res.json();
                    applyLayoutToUI(config);
                } catch (e) { console.error("Layout sync failed."); }
            }

            function updateSidebar() {
                document.getElementById('panel-left-top').innerText = 
                    `Name: ${playerState.name}\nAccount: ${playerState.account}\nAge: ${playerState.age}\nJob: ${playerState.job}`;
            }

            // 3. Authoritative Interaction Handler
            document.getElementById('terminal-command-line').addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    const input = e.target.value.trim();
                    e.target.value = '';
                    
                    const res = await fetch('/api/character-setup', {
                        method: 'POST',
                        body: JSON.stringify({ name: input, userId: 'admin_session' })
                    });
                    
                    const result = await res.json();
                    if (result.success) {
                        syncState();
                    } else {
                        document.getElementById('terminal-log-output').innerText += `\n${result.error}`;
                    }
                }
            });

            // Boot Sequence
            window.addEventListener('DOMContentLoaded', () => {
                syncState();
                syncLayout();
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide - GM Sidebar Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Base Setup & Reset */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            box-sizing: border-box;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Hard Grid Workspace Layout - Variable Track Backbones focused on the Sidebar */
        .manuscript-workspace {
            display: grid;
            grid-template-columns: var(--sidebar-width, 320px) 1fr;
            grid-template-rows: var(--top-panel-height, 1fr) 1fr;
            grid-template-areas: 
                "left-top main-viewport"
                "left-bottom main-viewport";
            gap: 16px;
            width: 100vw;
            height: 100vh;
            padding: 12px;
            box-sizing: border-box;
        }

        /* Scroll Panel Base Containers */
        .scroll-panel-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Individual style hooks via fallback defaults */
            --font-weight: normal;
            --font-color: #4a3621;
            --font-outline: none;
        }

        /* Sliced Asset Background Layer using smallscroll.png */
        .scroll-background {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
            border-image: url('smallscroll.png') 60 20 60 20 fill;
            border-width: 60px 20px 60px 20px;
        }

        /* Text Wrapping Matrix mapped to safe parchment zones */
        .scroll-text-wrapper {
            position: absolute;
            top: var(--text-y-offset, 12%);
            left: 12%;
            right: 12%;
            bottom: 12%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Enforcing the exact 'Press Start 2P' retro aesthetic with dynamic decoration loops */
        .scroll-text-entry {
            font-family: 'Press Start 2P', monospace;
            color: var(--font-color);
            font-weight: var(--font-weight);
            text-shadow: var(--font-outline);
            font-size: clamp(8px, 1.8cqi, 12px);
            white-space: pre-wrap;
            word-break: break-word;
            outline: none;
            line-height: 1.6;
        }

        /* Highlight editable/movable elements during configuration states */
        .manuscript-workspace.edit-active .scroll-panel-container {
            outline: 2px dashed #f5da91;
            cursor: pointer;
        }

        .manuscript-workspace.edit-active .scroll-panel-container.selected-target {
            outline: 2px solid #8c2d19;
            box-shadow: 0 0 8px rgba(140, 45, 25, 0.6);
        }

        .scroll-text-entry[contenteditable="true"] {
            background: rgba(245, 218, 145, 0.2);
        }

        /* Main Map/Game Viewport Window */
        .main-viewport {
            grid-area: main-viewport;
            border: 4px double #4a3621;
            background: rgba(20, 20, 20, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7a6048;
        }

        /* GM Layout Control Panel Overlay */
        .gm-inspector {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2e2214;
            color: #f5da91;
            padding: 15px;
            border: 2px solid #f5da91;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 300px;
        }
        .gm-inspector h3 {
            margin: 0 0 10px 0;
            font-size: 10px;
            text-transform: uppercase;
            text-align: center;
        }
        .gm-inspector button {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            background: #f5da91;
            color: #2e2214;
            border: none;
            padding: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 12px;
        }
        .gm-inspector .control-group {
            margin-bottom: 10px;
        }
        .gm-inspector label {
            display: block;
            font-size: 7px;
            margin-bottom: 4px;
        }
        .gm-inspector input[type="range"], .gm-inspector select, .gm-inspector input[type="color"] {
            width: 100%;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            background: #1a120b;
            color: #f5da91;
            border: 1px solid #4a3621;
            box-sizing: border-box;
        }
        .gm-inspector input[type="color"] {
            height: 24px;
            padding: 2px;
            cursor: pointer;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-row input {
            width: auto !important;
        }
    </style>
</head>
<body>

    <div id="manuscript-workspace" class="manuscript-workspace">
        
        <div id="panel-left-top" class="scroll-panel-container" style="grid-area: left-top;" onclick="selectPanel(this, event)">
            <div class="scroll-background"></div>
            <div class="scroll-text-wrapper">
                <div id="text-left-top" class="scroll-text-entry" contenteditable="false">NAME: HERO&#10;LVL: 01&#10;JOB: SQUIRE</div>
            </div>
        </div>

        <div id="panel-left-bottom" class="scroll-panel-container" style="grid-area: left-bottom;" onclick="selectPanel(this, event)">
            <div class="scroll-background"></div>
            <div class="scroll-text-wrapper">
                <div id="text-left-bottom" class="scroll-text-entry" contenteditable="false">QUEST:&#10;CLEAR THE FLOOR</div>
            </div>
        </div>

        <div class="main-viewport">
            [VIEWPORT RENDER LAYER]
        </div>
    </div>

    <div id="gm-inspector-panel" class="gm-inspector">
        <h3>SIDEBAR RENDER DECK</h3>
        <button id="btn-toggle-edit" onclick="toggleEditMode()">TOGGLE DESIGNER</button>
        
        <div class="control-group">
            <label>SIDEBAR WIDTH (PX):</label>
            <input type="range" id="slide-width" min="200" max="500" value="320" oninput="resizeGridTrack('width', this.value)" disabled>
        </div>
        <div class="control-group">
            <label>SIDEBAR SPLIT STEP (%):</label>
            <input type="range" id="slide-split" min="20" max="80" value="50" oninput="resizeGridTrack('split', this.value)" disabled>
        </div>

        <hr style="border-color: #4a3621; margin: 12px 0;">
        <h3 style="font-size: 8px;">FONT STYLE EDITOR</h3>
        
        <div class="control-group">
            <label>TEXT LINE OFFSET (%):</label>
            <input type="range" id="text-offset-slider" min="5" max="65" value="12" oninput="updateSelectedStyle('offset', this.value)" disabled>
        </div>
        <div class="control-group">
            <label>FONT COLOR:</label>
            <input type="color" id="font-color-picker" value="#4a3621" oninput="updateSelectedStyle('color', this.value)" disabled>
        </div>
        <div class="control-group checkbox-row">
            <input type="checkbox" id="font-bold-check" onchange="updateSelectedStyle('bold', this.checked)" disabled>
            <label for="font-bold-check" style="margin: 0;">BOLDFACE TYPE</label>
        </div>
        <div class="control-group checkbox-row">
            <input type="checkbox" id="font-outline-check" onchange="updateSelectedStyle('outline', this.checked)" disabled>
            <label for="font-outline-check" style="margin: 0;">WHITE OUTLINE</label>
        </div>
    </div>

    <script>
        let isEditMode = false;
        let activeTargetPanel = null;
        const workspace = document.getElementById('manuscript-workspace');

        // Activates configuration flags and parameters across layout containers
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const textNodes = document.querySelectorAll('.scroll-text-entry');
            const toggleButton = document.getElementById('btn-toggle-edit');
            const layoutControls = ['slide-width', 'slide-split'];
            
            if (isEditMode) {
                workspace.classList.add('edit-active');
                toggleButton.innerText = "LOCK GRID SECTOR";
                toggleButton.style.background = "#8c2d19";
                toggleButton.style.color = "#ffffff";
                
                layoutControls.forEach(id => document.getElementById(id).removeAttribute('disabled'));
                textNodes.forEach(node => node.contentEditable = "true");
            } else {
                workspace.classList.remove('edit-active');
                toggleButton.innerText = "TOGGLE DESIGNER";
                toggleButton.style.background = "#f5da91";
                toggleButton.style.color = "#2e2214";
                
                // Drop active selections and clear input states
                if (activeTargetPanel) {
                    activeTargetPanel.classList.remove('selected-target');
                    activeTargetPanel = null;
                }
                
                const allControls = [...layoutControls, 'text-offset-slider', 'font-color-picker', 'font-bold-check', 'font-outline-check'];
                allControls.forEach(id => {
                    const el = document.getElementById(id);
                    el.setAttribute('disabled', 'true');
                    if (el.type === 'checkbox') el.checked = false;
                });
                
                textNodes.forEach(node => node.contentEditable = "false");
                serializeWorkspaceState();
            }
        }

        // Handles node focus targeting inside edit state boundaries
        function selectPanel(element, event) {
            if (!isEditMode) return;
            
            // Stop event bubbling to prevent clicking nested items from cross-firing
            event.stopPropagation();

            if (activeTargetPanel) {
                activeTargetPanel.classList.remove('selected-target');
            }

            activeTargetPanel = element;
            activeTargetPanel.classList.add('selected-target');

            // Unlock typography engine fields in tool inspector
            const fontControls = ['text-offset-slider', 'font-color-picker', 'font-bold-check', 'font-outline-check'];
            fontControls.forEach(id => document.getElementById(id).removeAttribute('disabled'));

            // Pull runtime computations and synchronize sliders to match the selected zone
            const wrapper = element.querySelector('.scroll-text-wrapper');
            const currentOffset = parseInt(window.getComputedStyle(wrapper).getPropertyValue('--text-y-offset') || "12");
            document.getElementById('text-offset-slider').value = currentOffset;

            const currentColor = window.getComputedStyle(element).getPropertyValue('--font-color').trim() || "#4a3621";
            // Standardize RGB responses back into hexadecimal strings for color element compliance
            document.getElementById('font-color-picker').value = rgbToHex(currentColor);

            const currentWeight = window.getComputedStyle(element).getPropertyValue('--font-weight').trim();
            document.getElementById('font-bold-check').checked = (currentWeight === 'bold');

            const currentOutline = window.getComputedStyle(element).getPropertyValue('--font-outline').trim();
            document.getElementById('font-outline-check').checked = (currentOutline !== 'none' && currentOutline !== '');
        }

        // Modifies custom context styling parameters inside a targeted panel division
        function updateSelectedStyle(property, value) {
            if (!activeTargetPanel || !isEditMode) return;

            const wrapper = activeTargetPanel.querySelector('.scroll-text-wrapper');

            if (property === 'offset') {
                wrapper.style.setProperty('--text-y-offset', `${value}%`);
            } else if (property === 'color') {
                activeTargetPanel.style.setProperty('--font-color', value);
            } else if (property === 'bold') {
                activeTargetPanel.style.setProperty('--font-weight', value ? 'bold' : 'normal');
            } else if (property === 'outline') {
                // Multi-directional sharp pixel silhouette drop-shadow strings mapping crisp retro rendering rules
                const outlineString = value ? 
                    '-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff' : 'none';
                activeTargetPanel.style.setProperty('--font-outline', outlineString);
            }
        }

        // Recomputes track structures while preserving explicit containment guidelines
        function resizeGridTrack(type, value) {
            if (!isEditMode) return;
            
            if (type === 'width') {
                workspace.style.setProperty('--sidebar-width', `${value}px`);
            } else if (type === 'split') {
                workspace.style.setProperty('--top-panel-height', `${value}fr`);
            }
        }

        // Formats computed color arrays back into hex configurations
        function rgbToHex(rgb) {
            if (rgb.startsWith('#')) return rgb;
            const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (!match) return "#4a3621";
            return "#" + [match[1], match[2], match[3]].map(x => {
                const hex = parseInt(x).toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join('');
        }

        // Gathers layout blueprints for direct Cloudflare D1 insertion loops
        function serializeWorkspaceState() {
            const statePayload = {
                active_sector: "left_sidebar_only",
                dimensions: {
                    sidebar_width: window.getComputedStyle(workspace).getPropertyValue('--sidebar-width') || "320px",
                    top_panel_weight: window.getComputedStyle(workspace).getPropertyValue('--top-panel-height') || "1fr"
                },
                panel_manifest: []
            };

            document.querySelectorAll('.scroll-panel-container').forEach(panel => {
                const textEntry = panel.querySelector('.scroll-text-entry');
                const wrapper = panel.querySelector('.scroll-text-wrapper');
                
                statePayload.panel_manifest.push({
                    dom_id: panel.id,
                    inner_text: textEntry.innerHTML,
                    style_attributes: {
                        text_y_offset: window.getComputedStyle(wrapper).getPropertyValue('--text-y-offset') || "12%",
                        font_color: window.getComputedStyle(panel).getPropertyValue('--font-color') || "#4a3621",
                        font_weight: window.getComputedStyle(panel).getPropertyValue('--font-weight') || "normal",
                        font_outline: window.getComputedStyle(panel).getPropertyValue('--font-outline') || "none"
                    }
                });
            });

            console.log("Sidebar Configuration compiled for delivery:", JSON.stringify(statePayload, null, 2));
        }
    </script>
</body>
</html>

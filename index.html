<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Worlds Collide - GM Persistent Workspace</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Press Start 2P', monospace; }
        .manuscript-workspace { display: flex; width: 100vw; height: 100vh; padding: 12px; gap: 16px; }
        .sidebar { width: 320px; position: relative; }
        .scroll-panel { position: relative; width: 100%; border-image: url('smallscroll.png') 60 20 60 20 fill; border-width: 60px 20px 60px 20px; resize: vertical; overflow: auto; }
        .main-viewport { flex-grow: 1; border: 4px double #4a3621; position: relative; }
        .timer-container { position: absolute; top: 10px; right: 10px; color: #f5da91; }
    </style>
</head>
<body>

    <div class="manuscript-workspace">
        <div class="sidebar" id="ui-panels">
            <div id="panel-left-top" class="scroll-panel" contenteditable="true">Panel 1</div>
        </div>

        <div class="main-viewport">
            <div class="timer-container">
                <img src="hourglassremove.png" width="24">
                <span id="utc-clock">00:00:00 UTC</span>
            </div>
            <div class="terminal-console-panel">
                <div id="log"></div>
                <input type="text" id="cmd" autofocus>
            </div>
        </div>
    </div>

    <script>
        // Restoring GM UI Designer Logic
        let gmMode = true; 

        function applyLayoutToUI(config) {
            if(!config || !config.panels) return;
            // logic to apply saved percentages to panel divs
        }

        async function saveLayout() {
            const panels = document.querySelectorAll('.scroll-panel');
            const layoutData = { panels: Array.from(panels).map(p => ({ id: p.id, height: p.style.height })) };
            await fetch('/api/ui-manager', { method: 'POST', body: JSON.stringify(layoutData) });
        }

        // Restoring Hourglass Timer
        function updateClock() {
            const now = new Date();
            document.getElementById('utc-clock').innerText = now.toUTCString().split(' ')[4] + " UTC";
        }
        setInterval(updateClock, 1000);

        // Restoring Text Editing
        document.querySelectorAll('.scroll-panel').forEach(p => {
            p.addEventListener('blur', saveLayout); // Auto-save on blur
        });

        // Sync with Server on Load
        window.addEventListener('DOMContentLoaded', async () => {
            const res = await fetch('/api/ui-manager');
            const config = await res.json();
            applyLayoutToUI(config);
            updateClock();
        });
    </script>
</body>
</html>

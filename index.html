<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Worlds Collide - Authoritative Workspace</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Press Start 2P', monospace; }
        .manuscript-workspace { display: flex; height: 100vh; padding: 20px; }
        .sidebar { width: 320px; border: 2px solid #4a3621; padding: 10px; }
        #terminal { height: 150px; background: #000; color: #aaa; }
    </style>
</head>
<body>
    <div class="manuscript-workspace">
        <div class="sidebar" id="panel-container"></div>
        <div class="terminal">
            <div id="log"></div>
            <input type="text" id="cmd" autofocus>
        </div>
    </div>

    <script>
        (function() {
            let playerState = {};

            // Authoritative Load: Everything comes from the server
            async function syncState() {
                const res = await fetch('/api/get-status');
                if (!res.ok) return;
                playerState = await res.json();
                renderUI();
            }

            function renderUI() {
                document.getElementById('panel-container').innerText = 
                    `Name: ${playerState.name}\nAccount: ${playerState.account}\nAge: ${playerState.age}`;
            }

            document.getElementById('cmd').addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    const val = e.target.value;
                    const res = await fetch('/api/character-setup', {
                        method: 'POST',
                        body: JSON.stringify({ name: val, userId: 'user_123' })
                    });
                    const data = await res.json();
                    if (data.success) syncState();
                    else alert(data.error);
                }
            });

            syncState();
        })();
    </script>
</body>
</html>

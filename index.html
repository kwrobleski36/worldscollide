<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide | The Manuscript</title>
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-dark: #8b6d1b;
            --pixel-border: 4px;
            --bg-overlay: rgba(0, 0, 0, 0.7);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #000;
        }
        
        .landing-page {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Explicit background layer for GitHub/Cloudflare rendering */
        .background-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('wclonglogo.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* Logo positioned in the upper third */
        #game-branding {
            margin-top: 10vh;
            height: 25vh;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }

        .pixel-logo {
            font-size: clamp(2rem, 8vw, 4.5rem);
            color: var(--gold-primary);
            text-shadow: var(--pixel-border) var(--pixel-border) 0px #000, 2px 2px 0px var(--gold-dark);
            text-transform: uppercase; font-weight: 900; letter-spacing: 2px; text-align: center;
        }

        #ui-interact {
            flex-grow: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }

        .snes-button {
            background: var(--gold-primary);
            border: var(--pixel-border) solid var(--gold-dark);
            box-shadow: var(--pixel-border) var(--pixel-border) 0px #000;
            padding: 16px 32px; cursor: pointer;
            font-weight: bold; font-size: 1.1rem; color: #000;
            text-transform: uppercase; transition: transform 0.1s;
        }

        .snes-button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }

        /* Login Modal using frames from manucript.jpg */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-overlay);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .manuscript-frame {
            background: #1a1a1a; padding: 40px; color: #fff; text-align: center;
            max-width: 90%; width: 440px;
            border: 24px solid transparent;
            border-image-source: url('manucript.jpg'); /* Slicing frames from asset */
            border-image-slice: 60; border-image-repeat: stretch;
            box-sizing: border-box; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        #auth-status { margin: 20px 0; min-height: 40px; color: var(--gold-primary); }
    </style>
</head>
<body>
    <div class="landing-page">
        <div class="background-layer"></div>
        <header id="game-branding">
            <h1 class="pixel-logo">Worlds Collide</h1>
        </header>
        <main id="ui-interact">
            <button id="auth-trigger" class="snes-button">Create / Login</button>
        </main>
        <div id="auth-modal" class="modal-overlay">
            <div class="manuscript-frame">
                <h2 style="color: var(--gold-primary); text-shadow: 2px 2px 0px #000;">Access The Manuscript</h2>
                <div id="auth-status">Verify identity to continue...</div>
                <button id="passkey-btn" class="snes-button" style="width: 100%;">Continue with Passkey</button>
                <p style="font-size: 0.75rem; margin-top: 20px; opacity: 0.6;">
                    <strong>2026 Security Standard:</strong> Phishing-resistant WebAuthn active.
                </p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const setup = () => {
                const modal = document.getElementById('auth-modal');
                const trigger = document.getElementById('auth-trigger');
                const passkeyBtn = document.getElementById('passkey-btn');
                const status = document.getElementById('auth-status');

                if (!modal || !trigger) return;
                trigger.onclick = () => modal.classList.add('active');
                modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

                if (passkeyBtn) {
                    passkeyBtn.onclick = () => {
                        passkeyBtn.disabled = true;
                        status.innerText = "Requesting biometric challenge...";
                        setTimeout(() => {
                            status.innerText = "Identity verified. Entering game...";
                            passkeyBtn.innerText = "Verified";
                        }, 1200);
                    };
                }
            };
            window.addEventListener('load', setup);
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide - Landing</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }

        /* [cite: 160, 232] */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('wclonglogo.jpeg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* [cite: 85, 145] */
        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .interaction-container {
            margin-top: 45vh; /* [cite: 226] */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* [cite: 138, 206, 227] */
        .manuscript-frame {
            border: 20px solid transparent;
            border-image: url('manucript.jpg') 30 round;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            color: #ffd700;
            text-align: center;
            image-rendering: pixelated;
        }

        button {
            background: #ffd700;
            color: #000;
            border: 4px solid #b8860b;
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 4px 4px 0px #000;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>

    <div class="ui-layer">
        <div class="interaction-container">
            <div class="manuscript-frame" id="login-window">
                <h2>THE MANUSCRIPT</h2>
                <p>Secure Entry Protocol</p>
                <button onclick="simulatePasskey()">Create / Login</button>
            </div>
        </div>
    </div>

    <script>
        function simulatePasskey() {
            console.log("Initiating WebAuthn/Passkey Handshake...");
            alert("Passkey simulation: Authenticating with device biometrics...");
            // [cite: 154, 207]
        }
    </script>
</body>
</html>

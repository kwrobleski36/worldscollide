<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Explicit Background Layer Technique [cite: 124, 181] */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Prevents background from covering interactive UI [cite: 181, 199] */
            background-image: url('wclonglogo.jpeg'); /* Correct pixel-art landscape background [cite: 3, 186] */
            background-repeat: no-repeat;
            background-position: center top;
            
            /* Fluid scale matching viewport width to keep side creatures visible [cite: 17] */
            background-size: 100% auto; 
        }

        /* Hard scaling limit threshold for split-window/half-window views [cite: 17, 18] */
        @media (max-width: 1024px) {
            .background-layer {
                /* Halts fluid downscaling and locks minimum size to prevent UI clipping [cite: 18, 19] */
                background-size: 1024px auto;
            }
        }

        /* Interactive Component Layer [cite: 182] */
        .ui-container {
            position: relative;
            z-index: 10; /* Locked above background to ensure elements stay clickable [cite: 182, 199] */
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Sliced UI Frame using the Clear Frame from Sprite Sheet [cite: 204, 208] */
        .login-frame {
            /* Anchors login elements directly below the upper-third logo space [cite: 42, 206] */
            margin-top: 45vh; 
            width: 380px;
            padding: 25px;
            background-color: rgba(0, 0, 0, 0.85);
            
            /* Programmatic border-slicing preserving pixel-art corners [cite: 95, 209, 216] */
            border-style: solid;
            border-width: 20px;
            border-image: url('manucript.jpg') 150 retry; /* Uses 150px cutting instructions [cite: 219] */
            image-rendering: pixelated; /* Enforces sharp, non-blurry SNES scaling retro style [cite: 5, 218] */
            
            text-align: center;
            color: #ffffff;
        }

        .menu-title {
            font-size: 1.2rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px #000;
        }

        /* High-contrast retro metallic gold action button [cite: 44, 63] */
        .btn-passkey {
            display: inline-block;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #000000;
            background-color: #ffd700;
            border: 4px solid #b8860b;
            box-shadow: 0 4px #000000;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-passkey:active {
            transform: translateY(4px);
            box-shadow: 0 0 #000000;
        }

        /* Invisible protection alignment slot [cite: 70, 103] */
        .turnstile-container {
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>

    <div class="ui-container">
        <div class="login-frame">
            <div class="menu-title">Gate of Fates</div>
            
            <button class="btn-passkey" onclick="handlePasskeyLogin()">Continue with Passkey</button>
            
            <div class="turnstile-container">
                <div id="cf-turnstile-simulated" style="color: #666; font-size: 0.75rem;">[ Cloudflare Turnstile Secure ]</div>
            </div>
        </div>
    </div>

    <script>
        // Local simulation fallback preventing DOM execution dependencies [cite: 106, 120]
        window.addEventListener('load', () => {
            console.log("Worlds Collide Landing Engine Initialized.");
        });

        function handlePasskeyLogin() {
            console.log("Initiating WebAuthn handshake credential request..."); /* [cite: 111, 164] */
            alert("Requesting secure device cryptographic handshake...");
        }
    </script>
</body>
</html>

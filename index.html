<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide - Landing</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Responsive Background Layer */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('wclonglogo.jpeg') no-repeat center center;
            background-size: cover; /* Ensures responsiveness across screen sizes */
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Positioned below the 'Worlds Collide' text */
        .interaction-container {
            margin-top: 45vh; 
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
        }

        /* Login Window using the Clear Frame from UI Sprite Sheet */
        .login-frame {
            border: 40px solid transparent;
            /* Slicing the gold frame from the top-left of the UI sprite sheet */
            border-image: url('asset_s4tUfBtY77rmRNnEvbxF1XL8__Sprite sheet of gold 3D pixel-art UI elements based on the classic logo style. Includes empty frames, scroll bars, and \'The Manuscript\' control panel buttons. Transparent background, arran.jpeg') 150 round;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            color: #ffd700;
            text-align: center;
            image-rendering: pixelated;
        }

        button {
            background: #ffd700;
            color: #000;
            border: 4px solid #b8860b;
            padding: 10px 25px;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 4px 4px 0px #000;
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>

    <div class="ui-layer">
        <div class="interaction-container">
            <div class="login-frame" id="login-window">
                <h2 style="margin-top:0;">THE MANUSCRIPT</h2>
                <p>Awaiting Auth...</p>
                <button onclick="simulatePasskey()">Create / Login</button>
            </div>
        </div>
    </div>

    <script>
        function simulatePasskey() {
            alert("Initiating secure Passkey handshake...");
        }
    </script>
</body>
</html>

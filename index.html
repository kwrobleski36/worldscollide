<script>
    let playerState = {};

    async function loadGameState() {
        // Fetch server-side status (Age, Name, Account)
        const res = await fetch('/api/get-status');
        playerState = await res.json();
        
        // Fetch server-side layout
        const layoutRes = await fetch('/api/get-layout');
        const layout = await layoutRes.json();
        applyLayout(layout);
        
        refreshPanelRendering();
    }

    async function saveGMChanges(layoutData) {
        await fetch('/api/save-layout', {
            method: 'POST',
            body: JSON.stringify({ gmId: 'admin', layoutData })
        });
    }

    // Replace your old window.onload with this
    window.addEventListener('DOMContentLoaded', loadGameState);
</script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide - Server-Authoritative Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000; overflow: hidden; font-family: 'Press Start 2P', monospace; }
        .manuscript-workspace { display: flex; width: 100vw; height: 100vh; padding: 12px; box-sizing: border-box; gap: 16px; }
        .sidebar-container { display: flex; flex-direction: column; width: 320px; height: 100%; position: relative; }
        .scroll-panel-container { position: relative; width: 100%; overflow: hidden; }
        #panel-left-top { height: 300px; }
        #panel-left-bottom { flex-grow: 1; }
        .scroll-background { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; border-image: url('smallscroll.png') 60 20 60 20 fill; border-width: 60px 20px 60px 20px; }
        .scroll-text-wrapper { position: absolute; top: 15%; left: 14%; right: 14%; bottom: 15%; z-index: 2; }
        .scroll-text-entry { font-family: 'Press Start 2P', monospace; color: #4a3621; font-size: 10px; white-space: pre-wrap; }
        .main-viewport { flex-grow: 1; border: 4px double #4a3621; background: rgba(20, 20, 20, 0.8); display: flex; flex-direction: column; position: relative; }
        .terminal-console-panel { width: 100%; height: 180px; background: #000; border-top: 4px double #4a3621; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; }
        .terminal-log-area { flex-grow: 1; overflow-y: auto; color: #aaa; font-size: 9px; }
        .terminal-input-row { display: flex; align-items: center; color: #fff; font-size: 10px; }
        .terminal-input-field { flex-grow: 1; background: transparent; border: none; outline: none; color: #fff; font-family: 'Press Start 2P', monospace; font-size: 10px; }
    </style>
</head>
<body>

    <div class="manuscript-workspace">
        <div class="sidebar-container">
            <div id="panel-left-top" class="scroll-panel-container">
                <div class="scroll-background"></div>
                <div class="scroll-text-wrapper">
                    <div id="text-left-top" class="scroll-text-entry"></div>
                </div>
            </div>
            <div style="height: 16px;"></div>
            <div id="panel-left-bottom" class="scroll-panel-container">
                <div class="scroll-background"></div>
                <div class="scroll-text-wrapper">
                    <div id="text-left-bottom" class="scroll-text-entry"></div>
                </div>
            </div>
        </div>

        <div class="main-viewport">
            <div class="terminal-console-panel">
                <div class="terminal-log-area" id="terminal-log-output"></div>
                <div class="terminal-input-row">
                    <span>&gt;</span>
                    <input type="text" id="terminal-command-line" class="terminal-input-field" autocomplete="off" autofocus>
                </div>
            </div>
        </div>
    </div>

    <script>
        let playerState = { name: "...", account: "...", level: "...", age: "...", job: "..." };

        // Authoritative Server Handshake: Client only mirrors what the D1 database returns
        async function loadGameState() {
            try {
                const statusRes = await fetch('/api/get-status');
                if (statusRes.ok) {
                    playerState = await statusRes.json();
                    refreshUI();
                }
            } catch (e) { console.error("Server connection required."); }
        }

        function refreshUI() {
            document.getElementById('text-left-top').innerText = 
                `Name: ${playerState.name} (${playerState.account})\nLevel: ${playerState.level}\nAge: ${playerState.age}\nJob: ${playerState.job}`;
        }

        // Console Submission: Routes intent to secure Cloudflare edge handler
        document.getElementById('terminal-command-line').addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const input = e.target.value.trim();
                e.target.value = '';
                
                const res = await fetch('/api/character-setup', {
                    method: 'POST',
                    body: JSON.stringify({ name: input, userId: 'session_id' })
                });
                
                const result = await res.json();
                if (result.success) {
                    loadGameState(); // Re-sync state from authoritative server source
                } else {
                    document.getElementById('terminal-log-output').innerText += `\nError: ${result.error}`;
                }
            }
        });

        window.addEventListener('DOMContentLoaded', loadGameState);
    </script>
</body>
</html>

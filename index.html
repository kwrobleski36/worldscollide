<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worlds Collide</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            /* Applies the retro 8-bit font style across all text overlays */
            font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Explicit Background Layer Technique */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            /* Maps your new background featuring the white rabbit and demon cat */
            background-image: url("asset_rUg1f7Zaie6kw7EeVrkB6D4Q__Wide landscape-oriented landing page background based on the classic logo, 16_9 aspect ratio. Center_ large gold 3D pixel-art text 'Worlds Collide' at the top of the art. Left side_ forest f.jpg");
            background-repeat: no-repeat;
            background-position: center top;
            
            /* Stretches the asset to completely fill screen height and width */
            background-size: 100% 100%; [cite: 677]
        }

        /* UI Overlay Container */
        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Final Fantasy VI Style Menu Window */
        .ff-login-window {
            margin-top: 55vh; /* Retains the lowered layout constraint */ [cite: 679]
            width: 420px;
            padding: 24px;
            
            /* Color Composition: Deep purple fill with the classic retro tan/gold double-border */ [cite: 671]
            background-color: #1a0926; 
            border: 4px solid #e5c158;
            outline: 2px solid #000;
            box-shadow: inset 0 0 0 2px #3c1e5a, 0 8px 16px rgba(0,0,0,0.8);
            
            border-radius: 4px;
        }

        .ff-form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .ff-label {
            display: block;
            color: #e5c158; /* Tan label text */ [cite: 671]
            font-size: 0.65rem; /* Scaled down for 8-bit font readability */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }

        /* Classic Retro Text Input Slot */
        .ff-input-email {
            width: 100%;
            padding: 12px;
            font-family: inherit;
            font-size: 0.75rem;
            color: #ffffff;
            background-color: #000000;
            border: 2px solid #3c1e5a;
            outline: none;
            letter-spacing: 1px;
        }

        .ff-input-email:focus {
            border-color: #e5c158; /* Highlights tan border on selection */
        }

        /* FF6 Style Action Button */
        .ff-btn-login {
            width: 100%;
            padding: 14px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            
            /* Tan/gold primary button layout with purple text */ [cite: 671]
            color: #1a0926;
            background-color: #e5c158;
            border: 2px solid #ffffff;
            box-shadow: 0 4px #000000;
        }

        .ff-btn-login:active {
            transform: translateY(2px);
            box-shadow: 0 2px #000000;
        }

        .turnstile-holder {
            margin-top: 14px;
            font-size: 0.5rem;
            color: #5c3582;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="background-layer"></div>

    <div class="ui-container">
        <div class="ff-login-window">
            <form onsubmit="handleEmailLogin(event)">
                <div class="ff-form-group">
                    <label class="ff-label">Enter E-Mail Address</label>
                    <input type="email" class="ff-input-email" autocomplete="email" required placeholder="player@wcgroups.com">
                </div>
                
                <button type="submit" class="ff-btn-login">Confirm</button>
            </form>
            
            <div class="turnstile-holder">[ System Secure ]</div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            console.log("Worlds Collide Pixel-Font Menu Interface Initialized.");
        });

        function handleEmailLogin(event) {
            event.preventDefault();
            const emailInput = document.querySelector('.ff-input-email').value;
            console.log("Processing login token submission for: " + emailInput);
            alert("Handshake initialized for: " + emailInput);
        }
    </script>
</body>
</html>
